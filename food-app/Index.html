<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찰칵 영양 분석</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2421; --muted: #6b716d; --line: #e4e2dc;
    --brand: #e8590c; --brand-soft: #fff0e6; --ok: #2b8a3e; --ok-soft: #e6f4ea;
    --warn: #b35c00; --warn-soft: #fff3df; --bad: #c92a2a; --bad-soft: #fdecec;
    --carb: #f2a93b; --prot: #3b82c4; --fat: #d9534f;
    --radius: 16px; --tabh: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --ink: #ecefed; --muted: #9aa29d; --line: #2e3431;
      --brand: #ff7a33; --brand-soft: #3a2518; --ok: #5cc27a; --ok-soft: #1d3324;
      --warn: #f0a548; --warn-soft: #3a2c16; --bad: #ff6b6b; --bad-soft: #3a1d1d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 12px); }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px;
         padding-top: calc(14px + env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; }
  .top h1 { margin: 0; font-size: 20px; }
  .top small { color: var(--muted); }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }

  /* 아래 탭 막대 */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
               display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabbar button { height: var(--tabh); border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
                      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
  nav.tabbar button span { font-size: 22px; line-height: 1; }
  nav.tabbar button.on { color: var(--brand); font-weight: 700; }

  /* 버튼·입력 */
  .btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink);
         border-radius: 12px; padding: 12px 16px; cursor: pointer; min-height: 48px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
                padding: 9px 0; cursor: pointer; min-height: 44px; }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
  label.f { display: block; font-weight: 700; margin: 14px 0 6px; }
  input[type=number] { font: inherit; font-size: 18px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
                       background: var(--card); color: var(--ink); }
  .unit { position: relative; }
  .unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-style: normal; }
  .acts { display: grid; gap: 6px; }
  .acts button { text-align: left; font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .acts button.on { border-color: var(--brand); background: var(--brand-soft); }
  .acts b { display: block; }

  /* 사진 */
  .shot { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px 16px; text-align: center; }
  .shot .big { font-size: 46px; }
  .photo { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); display: block; }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .spin { width: 36px; height: 36px; border: 4px solid var(--line); border-top-color: var(--brand); border-radius: 50%;
          animation: spin 1s linear infinite; margin: 14px auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 결과 */
  .kcal { display: flex; align-items: center; gap: 16px; }
  .ring { --p: 0; --c: var(--ok); width: 104px; height: 104px; border-radius: 50%; flex: none; display: grid; place-items: center;
          background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); }
  .ring > div { width: 82px; height: 82px; border-radius: 50%; background: var(--card); display: grid; place-items: center; text-align: center; }
  .ring b { font-size: 22px; line-height: 1; }
  .ring small { font-size: 11px; color: var(--muted); }
  .verdict { display: inline-block; font-weight: 800; padding: 3px 10px; border-radius: 999px; font-size: 14px; }
  .v-ok { background: var(--ok-soft); color: var(--ok); }
  .v-warn { background: var(--warn-soft); color: var(--warn); }
  .v-bad { background: var(--bad-soft); color: var(--bad); }
  .macro { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 10px 0 6px; }
  .macro i { display: block; height: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .nut { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: center; }
  .nut .bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .nut .bar i { display: block; height: 100%; background: var(--ok); }
  .food { border-top: 1px solid var(--line); padding: 10px 0; }
  .food:first-of-type { border-top: 0; }
  .food .head { display: flex; justify-content: space-between; gap: 8px; }
  .food .x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .portion { display: flex; gap: 4px; margin-top: 6px; overflow-x: auto; }
  .portion button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                    border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .portion button.on { border-color: var(--brand); color: var(--brand); font-weight: 700; }
  .advice { background: var(--brand-soft); border-radius: 12px; padding: 12px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .msg { padding: 12px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); margin-bottom: 12px; }
  .demo { padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 12px; }

  /* 기록 */
  .daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .daynav button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px;
                   width: 48px; height: 44px; cursor: pointer; }
  .entry { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding: 10px 0; }
  .entry:first-of-type { border-top: 0; }
  .entry img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: none; background: var(--line); }
  .entry .grow { flex: 1; min-width: 0; }
  .entry .names { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20; }
</style>
</head>
<body>
<div class="top"><h1>📸 찰칵 영양 분석</h1><small id="who"></small></div>
<main>
  <div id="demo" class="demo hidden">체험 모드입니다. 사진을 올리면 예시 결과가 나옵니다. (Apps Script 에 올리면 실제 AI 분석)</div>
  <section id="v-shot"></section>
  <section id="v-log" class="hidden"></section>
  <section id="v-me" class="hidden"></section>
</main>
<nav class="tabbar">
  <button data-tab="shot" class="on"><span>📷</span>분석</button>
  <button data-tab="log"><span>📅</span>오늘 기록</button>
  <button data-tab="me"><span>👤</span>내 정보</button>
</nav>
<input type="file" id="cam" class="file" accept="image/*" capture="environment">
<input type="file" id="album" class="file" accept="image/*">

<script>
/* =========================================================
   기준값: 한국인 영양소 섭취기준(2020)
   ========================================================= */
const MEALS = { 아침: 0.25, 점심: 0.35, 저녁: 0.30, 간식: 0.10 };   // 하루 열량 중 끼니 비율
const ACTIVITY = [
  { name: '비활동적', desc: '하루 대부분 앉아서 지내요' },
  { name: '저활동적', desc: '걷기 등 가벼운 활동을 조금 해요' },
  { name: '활동적', desc: '체육·운동을 자주 해요' },
  { name: '매우 활동적', desc: '운동부처럼 매일 힘든 운동을 해요' },
];
// 신체활동계수 (남·여, 3~18세 / 19세 이상)
const PA = { M: { kid: [1.0, 1.13, 1.26, 1.42], adult: [1.0, 1.11, 1.25, 1.48] },
             F: { kid: [1.0, 1.16, 1.31, 1.56], adult: [1.0, 1.12, 1.27, 1.45] } };
// 에너지 적정비율(%)
const RANGE = { carb: [55, 65], protein: [7, 20], fat: [15, 30] };
// 나트륨 만성질환위험감소섭취량(mg/일)
function sodiumLimit(age) { return age <= 2 ? 1200 : age <= 5 ? 1600 : age <= 8 ? 1900 : 2300; }

/** 에너지필요추정량(kcal/일) */
function dailyKcal(p) {
  const h = p.height / 100, w = p.weight, a = p.age;
  let e;
  if (a < 19) {
    const pa = PA[p.sex].kid[p.activity];
    e = p.sex === 'M' ? 88.5 - 61.9 * a + pa * (26.7 * w + 903 * h) : 135.3 - 30.8 * a + pa * (10.0 * w + 934 * h);
    e += a <= 8 ? 20 : 25; // 성장에 필요한 에너지
  } else {
    const pa = PA[p.sex].adult[p.activity];
    e = p.sex === 'M' ? 662 - 9.53 * a + pa * (15.91 * w + 539.6 * h) : 354 - 6.91 * a + pa * (9.36 * w + 726 * h);
  }
  return Math.round(e / 10) * 10;
}
function bmiInfo(p) {
  const bmi = p.weight / Math.pow(p.height / 100, 2);
  let label = '';
  if (p.age >= 19) label = bmi < 18.5 ? '저체중' : bmi < 23 ? '정상' : bmi < 25 ? '비만 전단계' : '비만';
  return { bmi: Math.round(bmi * 10) / 10, label };
}

/* =========================================================
   저장 (이 휴대폰에만)
   ========================================================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const fmtDay = s => { const [y, m, d] = s.split('-').map(Number); return `${m}월 ${d}일(${'일월화수목금토'[new Date(y, m - 1, d).getDay()]})`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const r0 = n => Math.round(n), r1 = n => Math.round(n * 10) / 10;

function defaultMeal() {
  const h = new Date().getHours();
  return h < 10 ? '아침' : h < 15 ? '점심' : h < 21 ? '저녁' : '간식';
}
const state = {
  tab: 'shot', meal: defaultMeal(), profile: store.get('food.profile', null),
  photo: null, thumb: null, loading: false, error: '', result: null, logDay: ymd(new Date()),
};

/* =========================================================
   서버 연결 (Apps Script 밖에서는 예시 결과)
   ========================================================= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function analyze(base64, mime, ctx) {
  if (IS_GAS) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error(e.message || e))).analyzeFood(base64, mime, ctx));
  }
  return new Promise(res => setTimeout(() => res({
    isFood: true,
    advice: '채소 반찬이 적은 편이에요. 나물이나 샐러드를 곁들이고, 국물은 반만 드시면 나트륨을 줄일 수 있어요.',
    foods: [
      { name: '비빔밥', amount: '1그릇(450g)', kcal: 590, carb: 92, protein: 21, fat: 15, sugar: 8, fiber: 6, sodium: 980 },
      { name: '된장국', amount: '1그릇(250g)', kcal: 70, carb: 7, protein: 5, fat: 2.5, sugar: 2, fiber: 2, sodium: 820 },
      { name: '배추김치', amount: '1접시(40g)', kcal: 8, carb: 1.5, protein: 0.6, fat: 0.2, sugar: 0.5, fiber: 1, sodium: 260 },
    ],
  }), 900));
}

/** 사진을 줄여서(긴 쪽 1024px) JPEG base64 로. 기록용 작은 사진(160px)도 함께. */
function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const out = max => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL('image/jpeg', max > 500 ? 0.85 : 0.7);
      };
      const big = out(1024), small = out(160);
      URL.revokeObjectURL(url);
      res({ big, small });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이 사진 형식은 열 수 없어요. 카메라로 다시 찍어 주세요.')); };
    img.src = url;
  });
}

/* =========================================================
   계산
   ========================================================= */
function totals(foods) {
  const t = { kcal: 0, carb: 0, protein: 0, fat: 0, sugar: 0, fiber: 0, sodium: 0 };
  foods.forEach(f => Object.keys(t).forEach(k => { t[k] += (f[k] || 0) * (f.portion || 1); }));
  return t;
}
function evaluate(t, meal, p) {
  const day = dailyKcal(p), target = Math.round(day * MEALS[meal] / 10) * 10;
  const ratio = target ? t.kcal / target : 0;
  const v = ratio < 0.6 ? ['부족해요', 'v-bad'] : ratio < 0.85 ? ['조금 부족해요', 'v-warn'] : ratio <= 1.15 ? ['적정해요', 'v-ok']
          : ratio <= 1.4 ? ['조금 많아요', 'v-warn'] : ['많아요', 'v-bad'];
  const e = { carb: t.carb * 4, protein: t.protein * 4, fat: t.fat * 9 };
  const sum = e.carb + e.protein + e.fat || 1;
  const pct = { carb: e.carb / sum * 100, protein: e.protein / sum * 100, fat: e.fat / sum * 100 };
  const macro = k => pct[k] < RANGE[k][0] ? ['낮음', 'v-warn'] : pct[k] > RANGE[k][1] ? ['높음', 'v-warn'] : ['적정', 'v-ok'];
  const naMeal = sodiumLimit(p.age) * MEALS[meal];
  const fiberMeal = target / 1000 * 12;
  return { day, target, ratio, verdict: v, pct, macro, naMeal, fiberMeal };
}

/* =========================================================
   화면
   ========================================================= */
document.querySelector('nav.tabbar').onclick = e => {
  const b = e.target.closest('button[data-tab]');
  if (b) { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
};
function render() {
  if (!state.profile && state.tab !== 'me') state.tab = 'me';
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  ['shot', 'log', 'me'].forEach(t => $('#v-' + t).classList.toggle('hidden', t !== state.tab));
  const p = state.profile;
  $('#who').textContent = p ? `${p.sex === 'M' ? '남' : '여'} ${p.age}세 · ${p.height}cm · ${p.weight}kg` : '';
  if (state.tab === 'shot') renderShot();
  if (state.tab === 'log') renderLog();
  if (state.tab === 'me') renderMe();
}
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2000);
}
const mealSeg = () => `<div class="seg" id="meal-seg">${Object.keys(MEALS).map(m =>
  `<button data-meal="${m}" class="${state.meal === m ? 'on' : ''}">${m}</button>`).join('')}</div>`;
function ring(pct, color, big, small) {
  return `<div class="ring" style="--p:${Math.min(100, r0(pct))};--c:${color}"><div><div><b>${big}</b><br><small>${small}</small></div></div></div>`;
}

/* ---- 1. 분석 ---- */
function renderShot() {
  const v = $('#v-shot');
  let html = `<div class="card"><h3>언제 먹었나요?</h3>${mealSeg()}</div>`;
  if (state.error) html += `<div class="msg">${esc(state.error)}</div>`;
  if (!state.photo) {
    html += `<div class="card shot"><div class="big">🍱</div><p><b>음식 사진을 찍어 주세요</b><br><span class="muted small">위에서 내려다보듯 한 화면에 모두 담기게 찍으면 더 정확해요.</span></p>
      <div class="acts" style="gap:8px"><button class="btn primary block" id="go-cam">📷 사진 찍기</button>
      <button class="btn block" id="go-album">🖼️ 앨범에서 고르기</button></div></div>`;
  } else {
    html += `<div class="card" style="padding:8px"><img class="photo" src="${state.photo}" alt="음식 사진"></div>`;
    if (state.loading) html += `<div class="card" style="text-align:center"><div class="spin"></div><b>AI가 음식을 살펴보는 중…</b><p class="muted small">10초 정도 걸려요</p></div>`;
    else if (state.result) html += resultHTML();
    html += `<div class="row" style="margin-bottom:12px">${state.result && state.result.foods.length ? '<button class="btn primary" id="save">💾 기록에 저장</button>' : ''}
      <button class="btn" id="retake">📷 다시 찍기</button></div>`;
  }
  v.innerHTML = html;
  v.querySelectorAll('[data-meal]').forEach(b => b.onclick = () => { state.meal = b.dataset.meal; renderShot(); });
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('go-cam', () => $('#cam').click());
  on('go-album', () => $('#album').click());
  on('retake', () => { Object.assign(state, { photo: null, result: null, error: '' }); renderShot(); $('#cam').click(); });
  on('save', saveEntry);
  v.querySelectorAll('[data-por]').forEach(b => b.onclick = () => {
    state.result.foods[+b.dataset.i].portion = +b.dataset.por; renderShot();
  });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { state.result.foods.splice(+b.dataset.del, 1); renderShot(); });
}

function resultHTML() {
  const r = state.result, p = state.profile;
  if (!r.isFood || !r.foods.length) return `<div class="card"><b>음식을 찾지 못했어요.</b><p class="muted">음식이 잘 보이게 다시 찍어 주세요.</p></div>`;
  const t = totals(r.foods), ev = evaluate(t, state.meal, p);
  const color = ev.verdict[1] === 'v-ok' ? 'var(--ok)' : ev.verdict[1] === 'v-warn' ? 'var(--warn)' : 'var(--bad)';
  const nut = (name, val, unit, goal, goalText) => {
    const pc = goal ? Math.min(100, val / goal * 100) : 0;
    const over = goal && val > goal;
    return `<span>${name}</span><b>${r1(val)}${unit}</b><span class="muted small">${goalText || ''}</span>
      ${goal ? `<div class="bar"><i style="width:${pc}%;background:${over ? 'var(--bad)' : 'var(--ok)'}"></i></div>` : '<div class="bar" style="visibility:hidden"></div>'}`;
  };
  const portions = [0.5, 0.75, 1, 1.25, 1.5, 2];
  return `
    <div class="card">
      <div class="kcal">${ring(ev.ratio * 100, color, r0(t.kcal), 'kcal')}
        <div><div class="muted small">${state.meal} 권장 약 ${ev.target}kcal</div>
          <div style="font-size:20px;font-weight:800;margin:2px 0">${r0(ev.ratio * 100)}%</div>
          <span class="verdict ${ev.verdict[1]}">${state.meal}으로 ${ev.verdict[0]}</span></div></div>
    </div>
    <div class="card"><h3>3대 영양소 균형</h3>
      <div class="macro"><i style="width:${ev.pct.carb}%;background:var(--carb)"></i><i style="width:${ev.pct.protein}%;background:var(--prot)"></i><i style="width:${ev.pct.fat}%;background:var(--fat)"></i></div>
      <div class="legend">
        ${[['carb', '탄수화물', 'var(--carb)'], ['protein', '단백질', 'var(--prot)'], ['fat', '지방', 'var(--fat)']].map(([k, n, c]) => {
          const m = ev.macro(k);
          return `<span><i class="dot" style="background:${c}"></i>${n} ${r0(ev.pct[k])}% <span class="verdict ${m[1]}" style="font-size:12px;padding:1px 7px">${m[0]}</span></span>`;
        }).join('')}
      </div>
      <p class="note">권장 비율 탄수화물 55~65%, 단백질 7~20%, 지방 15~30%</p>
    </div>
    <div class="card"><h3>영양소</h3><div class="nut">
      ${nut('탄수화물', t.carb, 'g')}
      ${nut('단백질', t.protein, 'g')}
      ${nut('지방', t.fat, 'g')}
      ${nut('당류', t.sugar, 'g', ev.target * 0.2 / 4, `끼니 권장 ${r0(ev.target * 0.2 / 4)}g 이하`)}
      ${nut('식이섬유', t.fiber, 'g', 0, `끼니 목표 ${r0(ev.fiberMeal)}g`)}
      ${nut('나트륨', t.sodium, 'mg', ev.naMeal, `끼니 권장 ${r0(ev.naMeal)}mg 이하`)}
    </div></div>
    <div class="card"><h3>찾은 음식 ${r.foods.length}개</h3><p class="muted small" style="margin-top:-4px">양이 다르면 아래에서 고쳐 주세요.</p>
      ${r.foods.map((f, i) => `<div class="food"><div class="head"><div><b>${esc(f.name)}</b> <span class="muted small">${esc(f.amount)}</span></div>
        <div><b>${r0(f.kcal * (f.portion || 1))}</b> kcal <button class="x" data-del="${i}" aria-label="삭제">✕</button></div></div>
        <div class="portion">${portions.map(x => `<button data-i="${i}" data-por="${x}" class="${(f.portion || 1) === x ? 'on' : ''}">${x === 1 ? '그대로' : '×' + x}</button>`).join('')}</div></div>`).join('')}
    </div>
    ${r.advice ? `<div class="card advice">💡 ${esc(r.advice)}</div>` : ''}
    <p class="note" style="margin:0 4px 12px">사진으로 추정한 값이라 실제와 다를 수 있어요. 한국인 영양소 섭취기준(2020)으로 하루 ${ev.day}kcal를 기준으로 계산했어요.</p>`;
}

async function onPhoto(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  Object.assign(state, { error: '', result: null });
  try {
    const { big, small } = await shrink(file);
    Object.assign(state, { photo: big, thumb: small, loading: true });
    state.tab = 'shot'; render();
    const p = state.profile;
    const res = await analyze(big.split(',')[1], 'image/jpeg', {
      meal: state.meal, age: p.age, sex: p.sex, targetKcal: Math.round(dailyKcal(p) * MEALS[state.meal]),
    });
    res.foods.forEach(f => { f.portion = 1; });
    state.result = res;
  } catch (err) {
    state.error = err.message;
  }
  state.loading = false;
  renderShot();
}
$('#cam').onchange = onPhoto;
$('#album').onchange = onPhoto;

function saveEntry() {
  const log = store.get('food.log', {});
  const day = ymd(new Date());
  (log[day] = log[day] || []).push({
    id: Date.now(), meal: state.meal, time: new Date().toTimeString().slice(0, 5), thumb: state.thumb,
    foods: state.result.foods.map(f => ({ ...f })), advice: state.result.advice,
  });
  // 60일 지난 기록은 지운다
  const cut = addDays(day, -60);
  Object.keys(log).forEach(d => { if (d < cut) delete log[d]; });
  if (!store.set('food.log', log)) { toast('저장 공간이 부족해요. 예전 기록을 지워 주세요.'); return; }
  Object.assign(state, { photo: null, result: null, logDay: day, tab: 'log' });
  render(); toast('기록에 저장했어요');
}

/* ---- 2. 오늘 기록 ---- */
function renderLog() {
  const v = $('#v-log'), p = state.profile;
  const log = store.get('food.log', {}), list = log[state.logDay] || [];
  const day = dailyKcal(p);
  const all = list.flatMap(x => x.foods), t = totals(all);
  const pct = t.kcal / day * 100;
  const color = pct > 115 ? 'var(--bad)' : pct >= 85 ? 'var(--ok)' : 'var(--warn)';
  const isToday = state.logDay === ymd(new Date());
  const byMeal = Object.keys(MEALS).map(m => {
    const items = list.filter(x => x.meal === m);
    const k = totals(items.flatMap(x => x.foods)).kcal, goal = day * MEALS[m];
    return `<div class="nut" style="grid-template-columns:3em 1fr auto"><span>${m}</span>
      <div class="bar" style="grid-column:auto;margin:0"><i style="width:${Math.min(100, k / goal * 100)}%;background:${k > goal * 1.15 ? 'var(--bad)' : 'var(--ok)'}"></i></div>
      <span class="small">${r0(k)} / ${r0(goal)}</span></div>`;
  }).join('');
  v.innerHTML = `
    <div class="daynav"><button id="prev">◀</button><b>${fmtDay(state.logDay)}${isToday ? ' 오늘' : ''}</b><button id="next" ${isToday ? 'disabled' : ''}>▶</button></div>
    <div class="card"><div class="kcal">${ring(pct, color, r0(t.kcal), `/ ${day}kcal`)}
      <div><div class="muted small">하루 권장 열량의</div><div style="font-size:24px;font-weight:800">${r0(pct)}%</div>
      <div class="small muted">탄 ${r0(t.carb)}g · 단 ${r0(t.protein)}g · 지 ${r0(t.fat)}g<br>나트륨 ${r0(t.sodium)}mg / ${sodiumLimit(p.age)}mg</div></div></div></div>
    <div class="card"><h3>끼니별 열량 (kcal)</h3><div style="display:grid;gap:8px">${byMeal}</div></div>
    <div class="card"><h3>먹은 음식</h3>
      ${list.length ? list.map(x => {
        const k = totals(x.foods).kcal;
        return `<div class="entry">${x.thumb ? `<img src="${x.thumb}" alt="">` : '<img alt="">'}
          <div class="grow"><b>${esc(x.meal)}</b> <span class="muted small">${esc(x.time)}</span> · <b>${r0(k)}kcal</b>
          <div class="names">${x.foods.map(f => esc(f.name)).join(', ')}</div></div>
          <button class="x" data-rm="${x.id}" style="border:0;background:none;color:var(--muted);font-size:18px" aria-label="삭제">✕</button></div>`;
      }).join('') : '<p class="muted">아직 기록이 없어요. 📷 분석 탭에서 음식을 찍어 보세요.</p>'}
    </div>`;
  $('#prev').onclick = () => { state.logDay = addDays(state.logDay, -1); renderLog(); };
  $('#next').onclick = () => { if (!isToday) { state.logDay = addDays(state.logDay, 1); renderLog(); } };
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    if (!confirm('이 기록을 지울까요?')) return;
    log[state.logDay] = list.filter(x => String(x.id) !== b.dataset.rm);
    store.set('food.log', log); renderLog();
  });
}

/* ---- 3. 내 정보 ---- */
function renderMe() {
  const v = $('#v-me'), p = state.profile || { sex: '', age: '', height: '', weight: '', activity: 1 };
  const first = !state.profile;
  const draft = state.meDraft || (state.meDraft = { ...p });
  const valid = d => (d.sex === 'M' || d.sex === 'F') && d.age >= 3 && d.age <= 100 && d.height >= 80 && d.height <= 230 && d.weight >= 10 && d.weight <= 250;
  const ok = valid(draft);
  v.innerHTML = `
    ${first ? '<div class="card"><h2>반가워요! 👋</h2><p class="muted" style="margin:0">내 몸에 맞는 한 끼 열량을 계산하려면 아래 정보가 필요해요. 이 휴대폰에만 저장돼요.</p></div>' : ''}
    <div class="card">
      <label class="f" style="margin-top:0">성별</label>
      <div class="seg" id="sex"><button data-sex="M" class="${draft.sex === 'M' ? 'on' : ''}">남</button><button data-sex="F" class="${draft.sex === 'F' ? 'on' : ''}">여</button></div>
      <label class="f">나이</label><div class="unit"><input type="number" inputmode="numeric" id="age" value="${esc(draft.age)}" placeholder="예) 11"><em>세</em></div>
      <div class="row">
        <div><label class="f">키</label><div class="unit"><input type="number" inputmode="decimal" id="height" value="${esc(draft.height)}" placeholder="145"><em>cm</em></div></div>
        <div><label class="f">몸무게</label><div class="unit"><input type="number" inputmode="decimal" id="weight" value="${esc(draft.weight)}" placeholder="40"><em>kg</em></div></div>
      </div>
      <label class="f">평소 활동량</label>
      <div class="acts">${ACTIVITY.map((a, i) => `<button data-act="${i}" class="${+draft.activity === i ? 'on' : ''}"><b>${a.name}</b><span class="muted small">${a.desc}</span></button>`).join('')}</div>
    </div>
    <div id="me-sum">${sumHTML()}</div>
    <button class="btn primary block" id="save-me" ${ok ? '' : 'disabled'} style="margin-bottom:12px">${first ? '시작하기' : '저장'}</button>`;
  function sumHTML() {
    if (!valid(draft)) return '<p class="muted small" style="margin:0 4px 12px">성별·나이(3~100세)·키·몸무게를 모두 넣으면 권장 열량이 나와요.</p>';
    const d = dailyKcal(draft), b = bmiInfo(draft);
      return `<div class="card"><h3>나의 권장 열량</h3>
        <div style="font-size:28px;font-weight:800">하루 ${d.toLocaleString()} kcal</div>
        <div class="small muted" style="margin:4px 0 10px">BMI ${b.bmi}${b.label ? ' · ' + b.label : ' (어린이·청소년은 성장도표로 판단해요)'}</div>
        <div class="nut" style="grid-template-columns:1fr auto">${Object.entries(MEALS).map(([m, r]) => `<span>${m} (${r * 100}%)</span><b>${Math.round(d * r / 10) * 10} kcal</b>`).join('')}</div>
        <p class="note">한국인 영양소 섭취기준(2020) 에너지필요추정량 공식으로 계산했어요.</p></div>`;
  }
  const upd = () => { ['age', 'height', 'weight'].forEach(k => { draft[k] = $('#' + k).value === '' ? '' : +$('#' + k).value; }); };
  // 입력할 때는 다시 그리지 않고 요약만 바꾼다 (바로 '시작하기'를 눌러도 눌림이 사라지지 않게)
  ['age', 'height', 'weight'].forEach(k => $('#' + k).oninput = () => {
    upd(); $('#me-sum').innerHTML = sumHTML(); $('#save-me').disabled = !valid(draft);
  });
  v.querySelectorAll('[data-sex]').forEach(b => b.onclick = () => { upd(); draft.sex = b.dataset.sex; renderMe(); });
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { upd(); draft.activity = +b.dataset.act; renderMe(); });
  $('#save-me').onclick = () => {
    upd();
    if (!valid(draft)) return renderMe();
    state.profile = { ...draft }; state.meDraft = null;
    store.set('food.profile', state.profile);
    state.tab = 'shot'; render(); toast('저장했어요');
  };
}

if (!IS_GAS) $('#demo').classList.remove('hidden');
render();
</script>
