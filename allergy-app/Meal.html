<!-- 4. 식단 입력: 붙여넣기 분석, 저장된 식단 목록 -->
<script>
/* 번호가 없는 메뉴명에서 알레르기 식재료를 '추정'하는 사전 (영양교사가 반드시 확인) */
const GUESS = [
  [/우유|밀크|라떼/, [2]], [/치즈/, [2]], [/크림/, [2]], [/요구르트|요거트/, [2]], [/버터/, [2]],
  [/계란|달걀|에그|오믈렛|스크램블/, [1]], [/마요/, [1, 5]], [/전$|부침|동그랑땡/, [1, 6]],
  [/돈까스|돈가스|커틀릿/, [1, 2, 5, 6, 10]], [/튀김|까스|가스/, [1, 6]],
  [/빵|토스트|케이크|머핀|쿠키|와플|피자|파스타|스파게티|국수|만두|수제비|떡볶이|부침가루/, [6]],
  [/라면|짜장|짬뽕|우동/, [5, 6]], [/간장|된장|고추장|두부|두유|콩|유부/, [5]],
  [/메밀/, [3]], [/땅콩/, [4]], [/호두/, [14]], [/잣/, [19]], [/고등어/, [7]], [/게살|꽃게|크래미/, [8]], [/새우/, [9]],
  [/돼지|돈육|제육|삼겹|햄|소시지|베이컨|탕수육/, [10]], [/복숭아/, [11]], [/토마토|케첩|케찹/, [12]],
  [/건포도|와인/, [13]], [/닭|치킨|계육/, [15]], [/소고기|쇠고기|우육|불고기|장조림/, [16]],
  [/오징어/, [17]], [/조개|바지락|홍합|굴|전복|꼬막/, [18]],
];
function guessAllergens(name) {
  const set = new Set();
  GUESS.forEach(([re, nums]) => { if (re.test(name)) nums.forEach(n => set.add(n)); });
  return [...set].sort((a, b) => a - b);
}

/* ---- 3-2. 식단 입력 ---- */
function parseMenuText(text) {
  return text.split(/\r?\n|<br\s*\/?\s*>/i).map(s => s.trim()).filter(Boolean).map(line => {
    line = line.replace(/^[*#\-•·\s]+/, '');
    // "메뉴(1.2.5)", "메뉴 1.2.5.", "메뉴1.2.5." 형태의 끝부분 번호만 알레르기 번호로 본다
    const m = line.match(/^(.*?)(\s*\(\s*|\s+)?((?:\d{1,2}\s*[.,]\s*)*\d{1,2})\s*\.?\s*\)?\s*$/);
    let name = line, nums = [];
    if (m && m[1].trim() && (m[2] || /[.,]/.test(m[3]))) {
      name = m[1].trim();
      nums = m[3].split(/[.,]/).map(Number).filter(n => n >= 1 && n <= 19);
    }
    let guessed = false;
    if (!nums.length) { nums = guessAllergens(name); guessed = nums.length > 0; }
    return { name, allergens: [...new Set(nums)].sort((a, b) => a - b), guessed };
  });
}

/** 저장된 식단을 달별로 보여 주고, 날짜를 누르면 그 날 식단을 연다. */
function savedMealsHTML(cur) {
  const byMonth = {};
  state.admin.meals.forEach(m => (byMonth[m.date.slice(0, 7)] = byMonth[m.date.slice(0, 7)] || []).push(m.date));
  const months = Object.keys(byMonth).sort().slice(-3);
  if (!months.length) return '';
  return `<div class="card"><h3>저장된 식단</h3>
    <p class="sub">날짜를 누르면 그 날 식단을 보고 고칠 수 있습니다.</p>
    ${months.map(mo => `<div style="margin-bottom:8px"><b>${Number(mo.slice(5))}월</b> <span class="muted">(${byMonth[mo].length}일)</span><br>
      ${byMonth[mo].sort().map(d => `<button class="cand ${d === cur ? 'safe' : ''}" style="margin:3px 2px" data-meal-date="${d}">${fmtDate(d).replace(/^\d+월 /, '')}</button>`).join('')}</div>`).join('')}
  </div>`;
}
function renderMeal() {
  const date = state.mealDate;
  const saved = state.admin.meals.find(m => m.date === date);
  if (state.mealDraftDate !== date || !state.mealDraft) {
    state.mealDraft = saved ? saved.menus.map(m => ({ ...m, guessed: false })) : [];
    state.mealDraftDate = date;
  }
  const rows = state.mealDraft;
  const studs = approved();
  const pdfCard = typeof pdfCardHTML === 'function' ? pdfCardHTML() : '';
  $('#admin-content').innerHTML = pdfCard + savedMealsHTML(date) + `
    <div class="card">
      <h2>직접 입력·붙여넣기</h2>
      <p class="sub">NEIS 식단표를 복사해 붙여넣으면 메뉴 옆 알레르기 번호를 자동으로 읽습니다. 번호가 없는 메뉴는 이름으로 추정하니 꼭 확인하세요.</p>
      <div class="row"><label class="f" style="margin:0">날짜</label>
        <input type="date" id="meal-date" value="${date}" style="max-width:180px">
        <button class="btn" data-nav="-1">◀ 전날</button><button class="btn" data-nav="1">다음날 ▶</button>
        ${saved ? '<span class="ok">저장된 식단 있음</span>' : '<span class="muted">저장된 식단 없음</span>'}</div>
      <label class="f">식단 붙여넣기 (한 줄에 메뉴 하나)</label>
      <textarea id="meal-text" placeholder="예)\n현미밥\n쇠고기미역국(5.6.16)\n돈육떡갈비 1.2.5.6.10.13.\n계란말이\n우유"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="parse-replace">분석해서 아래 표 바꾸기</button>
        <button class="btn" id="parse-add">분석해서 아래 표에 추가</button>
      </div>
    </div>
    <div class="card">
      <h3>${fmtDate(date)} 메뉴</h3>
      ${rows.length ? `<table><thead><tr><th style="width:34%">메뉴</th><th style="width:22%">알레르기 번호</th><th>식품</th><th>주의 학생</th><th></th></tr></thead><tbody>
      ${rows.map((r, i) => {
        const who = studs.filter(s => r.allergens.some(a => s.allergens.includes(a)));
        return `<tr>
        <td><input type="text" data-i="${i}" data-k="name" value="${esc(r.name)}"></td>
        <td><input type="text" data-i="${i}" data-k="allergens" value="${r.allergens.join('.')}" placeholder="예) 1.2.6"></td>
        <td>${r.guessed ? '<span class="chip guess">추정·확인 필요</span><br>' : ''}${chips(r.allergens)}</td>
        <td>${who.length ? `<span class="bad">${who.length}명</span><br><span class="muted" style="font-size:13px">${who.map(s => esc(s.name)).join(', ')}</span>` : '<span class="muted">-</span>'}</td>
        <td><button class="btn sm danger" data-del="${i}">삭제</button></td></tr>`;
      }).join('')}</tbody></table>` : '<p class="muted">아직 메뉴가 없습니다. 위에 붙여넣거나 한 줄씩 추가하세요.</p>'}
      <div class="row" style="margin-top:10px">
        <button class="btn" id="add-row">+ 메뉴 한 줄 추가</button>
        <button class="btn primary" id="save-meal">식단 저장</button>
        ${saved ? '<button class="btn danger" id="del-meal">이 날 식단 삭제</button>' : ''}
      </div>
    </div>`;

  const c = $('#admin-content');
  if (typeof wirePdf === 'function') wirePdf(c);
  c.querySelectorAll('[data-meal-date]').forEach(b => b.onclick = () => { state.mealDate = b.dataset.mealDate; renderMeal(); });
  $('#meal-date').onchange = e => { if (e.target.value) { state.mealDate = e.target.value; renderMeal(); } };
  c.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.mealDate = addDays(state.mealDate, +b.dataset.nav); renderMeal(); });
  const parse = replace => {
    const parsed = parseMenuText($('#meal-text').value);
    if (!parsed.length) return alert('붙여넣은 메뉴가 없습니다.');
    state.mealDraft = replace ? parsed : rows.concat(parsed);
    renderMeal();
  };
  $('#parse-replace').onclick = () => parse(true);
  $('#parse-add').onclick = () => parse(false);
  $('#add-row').onclick = () => { rows.push({ name: '', allergens: [], guessed: false }); renderMeal(); };
  c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); renderMeal(); });
  c.querySelectorAll('input[data-k]').forEach(inp => inp.onchange = () => {
    const r = rows[+inp.dataset.i];
    if (inp.dataset.k === 'name') r.name = inp.value.trim();
    else {
      r.allergens = [...new Set(inp.value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 19))].sort((a, b) => a - b);
      r.guessed = false;
    }
    renderMeal();
  });
  $('#save-meal').onclick = () => {
    const g = rows.filter(r => r.guessed).length;
    if (g && !confirm(`이름으로 추정한 메뉴가 ${g}개 있습니다. 알레르기 번호를 확인하셨나요?`)) return;
    adminSave('saveMeal', [date, rows.map(r => ({ name: r.name, allergens: r.allergens }))],
      '식단이 저장되었습니다. 위험 체크가 자동으로 다시 계산됩니다.');
  };
  const dm = $('#del-meal');
  if (dm) dm.onclick = () => confirm('이 날 식단을 삭제할까요?') && adminSave('saveMeal', [date, []], '삭제되었습니다.');
}
</script>
