<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알레르기 급식 안전 알리미</title>
<style>
  :root {
    --bg: #f5f7f3; --card: #ffffff; --ink: #1e2a22; --muted: #66736b; --line: #dde4dd;
    --brand: #2e7d4f; --brand-soft: #e4f2e9;
    --danger: #c0392b; --danger-soft: #fdecea;
    --warn: #a86300; --warn-soft: #fff3df;
    --info-soft: #eaf1fb;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 14px 16px 0; }
  header h1 { margin: 0 0 10px; font-size: 19px; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs button { border: 0; background: transparent; color: #d7eadf; padding: 10px 14px; font: inherit;
                    font-weight: 600; border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; }
  nav.tabs button.on { background: var(--bg); color: var(--brand); }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .demo { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius);
          padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .demo button { margin-left: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  label.f { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=password], input[type=date], input[type=number], select, textarea {
    font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; background: #fff; color: var(--ink); }
  textarea { min-height: 140px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1 1 160px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #fff; color: var(--ink);
         padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
  .agrid label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px;
                 padding: 7px 8px; cursor: pointer; font-size: 14px; }
  .agrid label:has(input:checked) { background: var(--danger-soft); border-color: var(--danger); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg label { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--brand-soft); border-color: var(--brand); font-weight: 600; }
  .seg input { margin: 0 4px 0 0; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; margin: 2px 2px 2px 0;
          background: #eef1ee; color: var(--muted); white-space: nowrap; }
  .chip.hit { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .chip.guess { background: var(--warn-soft); color: var(--warn); }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-left: 4px; }
  .b-severe { background: var(--danger); color: #fff; }
  .b-caution { background: var(--warn-soft); color: var(--warn); }
  .b-mild { background: #eef1ee; color: var(--muted); }
  .b-epi { background: #7a2bb5; color: #fff; }
  .muted { color: var(--muted); }
  .ok { color: var(--brand); font-weight: 600; }
  .bad { color: var(--danger); font-weight: 600; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-top: 10px; }
  .msg.ok { background: var(--brand-soft); }
  .msg.bad { background: var(--danger-soft); }
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .week button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 4px;
                 cursor: pointer; text-align: center; color: var(--ink); }
  .week button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
  .week b { display: block; font-size: 20px; }
  .week b.zero { color: var(--muted); }
  .week b.some { color: var(--danger); }
  .week small { display: block; color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.alert b { color: var(--danger); }
  .class-head { font-weight: 700; margin: 16px 0 6px; color: var(--brand); }
  .stu { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--danger); border-radius: 10px;
         padding: 10px 12px; margin-bottom: 8px; }
  .stu .who { font-weight: 700; }
  .stu ul { margin: 6px 0 0; padding-left: 18px; }
  .stu li { margin: 2px 0; }
  .sub-ok { color: var(--brand); font-weight: 600; }
  .sub-none { color: var(--warn); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .menu-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; background: #fff; }
  .menu-card h3 { margin: 0 0 6px; }
  .cands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .cand { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
          padding: 5px 12px; cursor: pointer; }
  .cand.safe { border-color: var(--brand); }
  .cand.partial { border-color: var(--warn); }
  .cand small { color: var(--muted); }
  .pick { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(160px, 1.3fr); gap: 8px; align-items: center;
          padding: 6px 0; border-top: 1px dashed var(--line); }
  .warnline { color: var(--danger); font-size: 13px; font-weight: 600; }
  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .subtabs button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #fff; padding: 7px 14px;
                    border-radius: 999px; cursor: pointer; color: var(--ink); }
  .subtabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .note { font-size: 13px; color: var(--muted); background: var(--info-soft); padding: 8px 10px; border-radius: 8px; margin-top: 10px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center;
           padding: 30px 12px; overflow-y: auto; z-index: 10; }
  .modal .card { width: 100%; max-width: 640px; }
  .hidden { display: none !important; }
  .loading { color: var(--muted); padding: 20px 0; }

  /* 급식실 모니터 모드: 멀리서도 보이게 크게 */
  body.monitor { font-size: 21px; }
  body.monitor header, body.monitor .demo, body.monitor .no-monitor { display: none; }
  body.monitor main { max-width: none; }
  body.monitor .stat b { font-size: 44px; }
  body.monitor .stu .who { font-size: 24px; }
  body.monitor .chip { font-size: 18px; }
  .exit-monitor { display: none; }
  body.monitor .exit-monitor { display: inline-block; position: fixed; right: 12px; top: 12px; z-index: 5; }

  @media (max-width: 560px) {
    .row3 { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .stats { grid-template-columns: 1fr 1fr 1fr; }
    .stat b { font-size: 22px; }
    .pick { grid-template-columns: 1fr; }
  }
  @media print {
    header, .demo, .no-print, nav, .week, .subtabs { display: none !important; }
    body { background: #fff; }
    .card, .stu { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>🍱 알레르기 급식 안전 알리미</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="register">보호자 등록</button>
    <button data-tab="staff">선생님 공유</button>
    <button data-tab="admin">영양교사</button>
  </nav>
</header>
<button class="btn exit-monitor" onclick="setMonitor(false)">모니터 모드 끄기</button>
<main>
  <div id="demo" class="demo hidden">
    체험용 데모 모드입니다. 예시 데이터는 이 브라우저에만 저장됩니다.
    영양교사 PIN <b>1234</b>, 교직원 PIN <b>0000</b>
    <button class="btn sm" onclick="resetDemo()">예시 데이터 초기화</button>
  </div>

  <!-- 1. 보호자 등록 -->
  <section id="view-register" class="hidden">
    <div class="card">
      <h2>우리 아이 알레르기 등록</h2>
      <p class="sub">등록한 정보는 영양교사가 확인한 뒤 급식 관리에 사용됩니다. 학년이 바뀌거나 정보가 달라지면 다시 제출해 주세요.</p>
      <form id="reg-form" autocomplete="off"></form>
    </div>
  </section>

  <!-- 2. 선생님 공유 -->
  <section id="view-staff" class="hidden">
    <div id="staff-login" class="card hidden"></div>
    <div id="staff-body" class="hidden"></div>
  </section>

  <!-- 3. 영양교사 -->
  <section id="view-admin" class="hidden">
    <div id="admin-login" class="card hidden"></div>
    <div id="admin-body" class="hidden">
      <div class="subtabs no-print" id="admin-tabs">
        <button data-sub="plan">위험 체크·대체식</button>
        <button data-sub="meal">식단 입력</button>
        <button data-sub="students">학생 명단</button>
      </div>
      <div id="admin-content"></div>
    </div>
  </section>
</main>
<div id="modal" class="modal hidden"></div>

<script>
/* =========================================================
   기본 데이터: 알레르기 유발식품 19종(학교급식 식단표 표시 번호)
   ========================================================= */
const ALLERGENS = {
  1: '난류(달걀)', 2: '우유', 3: '메밀', 4: '땅콩', 5: '대두', 6: '밀', 7: '고등어', 8: '게', 9: '새우',
  10: '돼지고기', 11: '복숭아', 12: '토마토', 13: '아황산류', 14: '호두', 15: '닭고기', 16: '쇠고기',
  17: '오징어', 18: '조개류', 19: '잣'
};
const SEVERITY = { mild: '가벼움', caution: '주의', severe: '심각' };

/* 번호가 없는 메뉴명에서 알레르기 식재료를 '추정'하는 사전 (영양교사가 반드시 확인) */
const GUESS = [
  [/우유|밀크|라떼/, [2]], [/치즈/, [2]], [/크림/, [2]], [/요구르트|요거트/, [2]], [/버터/, [2]],
  [/계란|달걀|에그|오믈렛|스크램블/, [1]], [/마요/, [1, 5]], [/전$|부침|동그랑땡/, [1, 6]],
  [/돈까스|돈가스|커틀릿/, [1, 2, 5, 6, 10]], [/튀김|까스|가스/, [1, 6]],
  [/빵|토스트|케이크|머핀|쿠키|와플|피자|파스타|스파게티|국수|만두|수제비|떡볶이|부침가루/, [6]],
  [/라면|짜장|짬뽕|우동/, [5, 6]], [/간장|된장|고추장|두부|두유|콩|유부/, [5]],
  [/메밀/, [3]], [/땅콩/, [4]], [/호두/, [14]], [/잣/, [19]], [/고등어/, [7]], [/게살|꽃게|크래미/, [8]], [/새우/, [9]],
  [/돼지|돈육|제육|삼겹|햄|소시지|베이컨|탕수육/, [10]], [/복숭아/, [11]], [/토마토|케첩|케찹/, [12]],
  [/건포도|와인/, [13]], [/닭|치킨|계육/, [15]], [/소고기|쇠고기|우육|불고기|장조림/, [16]],
  [/오징어/, [17]], [/조개|바지락|홍합|굴|전복|꼬막/, [18]],
];
function guessAllergens(name) {
  const set = new Set();
  GUESS.forEach(([re, nums]) => { if (re.test(name)) nums.forEach(n => set.add(n)); });
  return [...set].sort((a, b) => a - b);
}

/* 대체식 후보: [이름, 그 대체식에 들어 있을 수 있는 알레르기 번호]
   메뉴 이름에 맞는 규칙을 먼저 쓰고, 없으면 알레르기 번호별 기본 후보를 쓴다. */
const SUB_RULES = [
  [/우유|밀크/, [['두유', [5]], ['쌀음료', []], ['제철 과일', []]]],
  [/요구르트|요거트/, [['두유 요거트', [5]], ['제철 과일', []]]],
  [/치즈/, [['치즈 빼고 별도 배식', []]]],
  [/크림/, [['토마토소스로 별도 조리', [12]], ['오일소스로 별도 조리', []]]],
  [/계란|달걀|에그|오믈렛|스크램블/, [['두부찜', [5]], ['애호박볶음', []], ['감자채볶음', []]]],
  [/전$|부침|튀김|까스|가스|동그랑땡/, [['쌀가루 반죽으로 별도 조리', []], ['감자전분 튀김옷', []], ['같은 재료 구이', []]]],
  [/빵|토스트|케이크|머핀|쿠키|와플|피자/, [['떡', []], ['찐 고구마', []], ['쌀강정', []]]],
  [/국수|스파게티|파스타|우동|라면|짜장|짬뽕|수제비/, [['쌀국수', []], ['쌀밥으로 대체', []]]],
  [/새우/, [['닭가슴살', [15]], ['두부', [5]], ['버섯', []]]],
  [/게살|꽃게|크래미|오징어|조개|바지락|홍합|굴|전복/, [['버섯', []], ['두부', [5]], ['닭고기', [15]]]],
  [/돼지|돈육|제육|삼겹|햄|소시지|베이컨|탕수육|돈까스|돈가스/, [['닭고기', [15]], ['쇠고기', [16]], ['두부', [5]]]],
  [/닭|치킨|계육/, [['돼지고기', [10]], ['쇠고기', [16]], ['두부', [5]]]],
  [/소고기|쇠고기|우육|불고기|장조림/, [['돼지고기', [10]], ['닭고기', [15]], ['버섯', []]]],
  [/고등어/, [['동태구이', []], ['닭고기', [15]]]],
  [/땅콩|호두|잣|견과/, [['견과 빼고 별도 배식', []], ['해바라기씨', []], ['호박씨', []]]],
  [/복숭아/, [['사과', []], ['배', []], ['귤', []]]],
  [/토마토|케첩|케찹/, [['간장소스', [5, 6]], ['오일소스', []]]],
  [/메밀/, [['쌀국수', []]]],
  [/김치|깍두기|겉절이|섞박지/, [['백김치(젓갈 없이)', []], ['오이무침', []], ['무생채(젓갈 없이)', []]]],
];
const SUB_BY_ALLERGEN = {
  1: [['두부요리', [5]], ['애호박볶음', []]], 2: [['두유', [5]], ['쌀음료', []]], 3: [['쌀국수', []]],
  4: [['견과 빼고 별도 배식', []]], 5: [['소금간으로 별도 조리', []]], 6: [['쌀가루로 별도 조리', []], ['쌀밥으로 대체', []]],
  7: [['동태구이', []]], 8: [['버섯볶음', []]], 9: [['닭가슴살', [15]]], 10: [['닭고기', [15]]],
  11: [['다른 제철 과일', []]], 12: [['오일소스', []]], 13: [['생과일', []]], 14: [['견과 빼고 별도 배식', []]],
  15: [['돼지고기', [10]]], 16: [['닭고기', [15]]], 17: [['버섯', []]], 18: [['버섯', []]], 19: [['견과 빼고 별도 배식', []]],
};
const SUB_ALWAYS = [['해당 메뉴 제외(밥·반찬 추가 배식)', []], ['가정 도시락 지참 안내', []]];
const KNOWN_SUB = {};
[...SUB_RULES.flatMap(r => r[1]), ...Object.values(SUB_BY_ALLERGEN).flat(), ...SUB_ALWAYS]
  .forEach(([n, a]) => { KNOWN_SUB[n] = a; });

function suggestSubs(menuName, hitAllergens) {
  let list = [];
  SUB_RULES.forEach(([re, cands]) => { if (re.test(menuName)) list.push(...cands); });
  if (!list.length) hitAllergens.forEach(a => list.push(...(SUB_BY_ALLERGEN[a] || [])));
  list.push(...SUB_ALWAYS);
  const seen = new Set();
  return list.filter(([n]) => !seen.has(n) && seen.add(n));
}
/** 대체식 이름에 들어 있을 수 있는 알레르기 번호 (사전 + 이름 추정) */
function subAllergens(name) {
  return [...new Set([...(KNOWN_SUB[name] || []), ...guessAllergens(name)])];
}

/* =========================================================
   공통 도구
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const DOW = '일월화수목금토';
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})`; };
function weekDates(s) {
  const d = parseYmd(s);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return [0, 1, 2, 3, 4].map(i => { const x = new Date(d); x.setDate(d.getDate() + i); return ymd(x); });
}
function schoolDay(d = new Date()) {
  const s = ymd(d), w = d.getDay();
  return w === 6 ? addDays(s, 2) : w === 0 ? addDays(s, 1) : s;
}
const chips = (nums, hits = []) => nums.map(n =>
  `<span class="chip ${hits.includes(n) ? 'hit' : ''}">${n}. ${esc(ALLERGENS[n])}</span>`).join('');
const stuLabel = s => `${s.grade}-${s.classNo} ${s.number}번 ${esc(s.name)}`;
const byClass = (a, b) => a.grade - b.grade || a.classNo - b.classNo || a.number - b.number;
function sevBadges(s) {
  return `<span class="badge b-${s.severity}">${SEVERITY[s.severity] || ''}</span>` +
         (s.epipen ? '<span class="badge b-epi">에피펜</span>' : '');
}

/** 학생 × 식단 대조: 위험 메뉴가 있는 학생만 돌려준다. */
function risksFor(students, meal) {
  if (!meal) return [];
  return students.map(st => ({
    student: st,
    items: meal.menus.map(m => ({ menu: m.name, hits: m.allergens.filter(a => st.allergens.includes(a)) }))
                     .filter(x => x.hits.length),
  })).filter(r => r.items.length).sort((a, b) => byClass(a.student, b.student));
}
const planKey = (menu, sid) => menu + '||' + sid;
function planMap(plans, date) {
  const m = {};
  plans.filter(p => p.date === date).forEach(p => { m[planKey(p.menu, p.studentId)] = p.substitute; });
  return m;
}

/* =========================================================
   서버 연결: Apps Script 안이면 google.script.run, 아니면 데모 서버
   ========================================================= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn, ...args) {
  if (IS_GAS) {
    return new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e.message || e)))[fn](...args));
  }
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e); } }, 120));
}

const Demo = (() => {
  const KEY = 'allergy-demo-v1';
  const PINS = { admin: '1234', staff: '0000' };
  let db = null;
  const clone = o => JSON.parse(JSON.stringify(o));
  const now = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
  const uid = () => Math.random().toString(36).slice(2, 10);
  function load() {
    if (db) return db;
    try { const s = localStorage.getItem(KEY); if (s) db = JSON.parse(s); } catch (e) {}
    return db || (db = seed());
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  function seed() {
    const st = (g, c, n, name, allergens, severity, epipen, memo, status = 'approved') =>
      ({ id: uid(), grade: g, classNo: c, number: n, name, allergens, severity, epipen, memo,
         guardian: name.slice(0, 1) + 'OO', contact: '010-0000-0000', status, createdAt: now(), updatedAt: now() });
    const students = [
      st(1, 2, 5, '김하늘', [2], 'caution', false, '우유 마시면 두드러기'),
      st(2, 1, 12, '이도윤', [4, 14, 19], 'severe', true, '땅콩 미량에도 호흡곤란 이력'),
      st(3, 3, 7, '박서연', [1, 2], 'mild', false, ''),
      st(4, 1, 3, '최민준', [9, 8, 18], 'caution', false, '갑각류 전체 주의'),
      st(5, 2, 21, '정우진', [6, 5], 'caution', false, '밀·대두 동시 알레르기'),
      st(6, 4, 9, '한지우', [11, 12], 'mild', false, ''),
      st(1, 1, 8, '오시아', [1], 'caution', false, '전학 예정 서류 확인 중', 'pending'),
    ];
    const week = weekDates(schoolDay());
    const M = (name, a) => ({ name, allergens: a });
    const menus = [
      [M('현미밥', []), M('쇠고기미역국', [5, 6, 16]), M('돈육떡갈비', [1, 2, 5, 6, 10, 13]), M('계란말이', [1]), M('배추김치', [9]), M('우유', [2])],
      [M('잡곡밥', []), M('바지락된장국', [5, 18]), M('새우튀김', [1, 5, 6, 9]), M('땅콩조림', [4, 5]), M('깍두기', [9]), M('복숭아', [11])],
      [M('크림스파게티', [1, 2, 6, 10]), M('마늘빵', [1, 2, 6]), M('양배추샐러드', [1, 5]), M('오이피클', []), M('요구르트', [2])],
      [M('카레라이스', [2, 5, 6, 10, 16]), M('어묵국', [1, 5, 6]), M('닭강정', [5, 6, 12, 15]), M('배추김치', [9]), M('토마토', [12])],
      [M('비빔밥', [1, 5, 16]), M('콩나물국', [5]), M('호두멸치볶음', [5, 14]), M('총각김치', [9]), M('우유', [2])],
    ];
    const meals = week.map((date, i) => ({ date, menus: menus[i], updatedAt: now() }));
    return { students, meals, plans: [] };
  }
  function role(pin) {
    if (pin === PINS.admin) return 'admin';
    if (pin === PINS.staff) return 'staff';
    throw new Error('PIN이 올바르지 않습니다.');
  }
  function needAdmin(pin) { if (role(pin) !== 'admin') throw new Error('영양교사 PIN이 필요합니다.'); }
  return {
    login: role,
    submitStudent(s) {
      validateStudent(s);
      load().students.push({ ...clone(s), id: uid(), status: 'pending', createdAt: now(), updatedAt: now() });
      save(); return true;
    },
    getAdminData(pin) { needAdmin(pin); return clone(load()); },
    getStaffData(pin, from, to) {
      role(pin);
      const d = load(), inR = r => r.date >= from && r.date <= to;
      return clone({
        students: d.students.filter(s => s.status === 'approved')
          .map(({ guardian, contact, ...rest }) => rest),
        meals: d.meals.filter(inR), plans: d.plans.filter(inR),
      });
    },
    saveStudent(pin, s) {
      needAdmin(pin); validateStudent(s);
      const d = load(), i = d.students.findIndex(x => x.id === s.id);
      if (i >= 0) d.students[i] = { ...d.students[i], ...clone(s), updatedAt: now() };
      else d.students.push({ ...clone(s), id: uid(), status: 'approved', createdAt: now(), updatedAt: now() });
      save(); return true;
    },
    setStudentStatus(pin, id, status) {
      needAdmin(pin);
      const s = load().students.find(x => x.id === id);
      if (!s) throw new Error('학생을 찾을 수 없습니다.');
      s.status = status; s.updatedAt = now(); save(); return true;
    },
    deleteStudent(pin, id) {
      needAdmin(pin);
      const d = load();
      d.students = d.students.filter(x => x.id !== id);
      d.plans = d.plans.filter(p => p.studentId !== id);
      save(); return true;
    },
    saveMeal(pin, date, menus) {
      needAdmin(pin);
      const d = load();
      d.meals = d.meals.filter(m => m.date !== date);
      const clean = menus.filter(m => m.name.trim()).map(m => ({ name: m.name.trim(), allergens: m.allergens }));
      if (clean.length) d.meals.push({ date, menus: clean, updatedAt: now() });
      d.meals.sort((a, b) => a.date < b.date ? -1 : 1);
      save(); return true;
    },
    savePlans(pin, date, plans) {
      needAdmin(pin);
      const d = load();
      d.plans = d.plans.filter(p => p.date !== date)
        .concat(plans.filter(p => p.substitute.trim()).map(p => ({ ...p, date, updatedAt: now() })));
      save(); return true;
    },
    reset() { db = seed(); save(); },
  };
})();
function resetDemo() {
  if (!confirm('예시 데이터로 되돌릴까요? 데모에서 입력한 내용이 지워집니다.')) return;
  Demo.reset(); state.admin = null; state.staff = null; route();
}

function validateStudent(s) {
  if (!(s.grade >= 1 && s.grade <= 6)) throw new Error('학년을 확인해 주세요.');
  if (!(s.classNo >= 1 && s.classNo <= 30)) throw new Error('반을 확인해 주세요.');
  if (!(s.number >= 1 && s.number <= 60)) throw new Error('번호를 확인해 주세요.');
  if (!String(s.name || '').trim()) throw new Error('학생 이름을 입력해 주세요.');
  if (!s.allergens || !s.allergens.length) throw new Error('알레르기 종류를 한 가지 이상 선택해 주세요.');
}

async function openStaff() {

    loginBox(box, '선생님 공유 화면', '교직원 PIN을 입력하면 날짜별로 알레르기 주의 학생과 대체식을 볼 수 있습니다.', (p) => {

  }
  $('#staff-login').classList.add('hidden');
  const body = $('#staff-body'); body.classList.remove('hidden');

  if (!state.staff || state.staffWeek !== week[0]) {
    body.innerHTML = '<div class="loading">불러오는 중…</div>';

      state.staff = await call('getStaffData', pin, week[0], week[4]);

      state.staffPin = null; store.del('staffPin'); state.staff = null;
      body.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;

    openStaff();
  });
  $('#cls-filter').onchange = e => { state.filter = e.target.value; renderStaff(); };
}
function refreshStaff() { state.staff = null; openStaff(); }
function setMonitor(on) { document.body.classList.toggle('monitor', on); window.scrollTo(0, 0); }

/* =========================================================
   3. 영양교사 화면
   ========================================================= */
async function openAdmin(force) {
  if (!state.adminPin) {
    $('#admin-body').classList.add('hidden');
    const box = $('#admin-login'); box.classList.remove('hidden');
    loginBox(box, '영양교사 관리 화면', '영양교사 PIN을 입력하세요.', (p, role) => {
      if (role !== 'admin') throw new Error('영양교사 PIN이 아닙니다.');
      state.adminPin = p; store.set('adminPin', p); openAdmin();
    });
    return;
  }
  $('#admin-login').classList.add('hidden');
  $('#admin-body').classList.remove('hidden');
  if (!state.admin || force) {
    $('#admin-content').innerHTML = '<div class="loading">불러오는 중…</div>';
    try { state.admin = await call('getAdminData', state.adminPin); }
    catch (err) {
      state.adminPin = null; store.del('adminPin');
      $('#admin-content').innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;
      setTimeout(openAdmin, 1500); return;
    }
  }
  renderAdmin();
}
function renderAdmin() {
  document.querySelectorAll('#admin-tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.sub === state.sub);
    if (b.dataset.sub === 'students') {
      const n = state.admin ? state.admin.students.filter(s => s.status === 'pending').length : 0;
      b.textContent = '학생 명단' + (n ? ` (승인 대기 ${n})` : '');
    }
  });
  if (!state.admin) return;
  if (state.sub === 'plan') renderPlan();
  if (state.sub === 'meal') renderMeal();
  if (state.sub === 'students') renderStudents();
}
async function adminSave(fn, args, okMsg, keepDraft) {
  try {
    await call(fn, state.adminPin, ...args);
    state.admin = await call('getAdminData', state.adminPin);
    state.staff = null;
    if (!keepDraft) { state.draft = null; state.mealDraft = null; }
    renderAdmin();
    if (okMsg) toast(okMsg);
  } catch (err) { alert(err.message); }
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'msg ok'; t.textContent = text;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.15)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
const approved = () => state.admin.students.filter(s => s.status === 'approved');

/* ---- 3-1. 위험 체크·대체식 ---- */
function renderPlan() {
  const { meals, plans } = state.admin;
  const date = state.planDate;
  const meal = meals.find(m => m.date === date);
  const studs = approved();
  const risks = risksFor(studs, meal);
  if (state.draftDate !== date || !state.draft) { state.draft = planMap(plans, date); state.draftDate = date; }
  const draft = state.draft;

  const week = weekDates(date);
  const weekHTML = week.map(d => {
    const m = meals.find(x => x.date === d);
    const rs = m ? risksFor(studs, m) : null;
    const pm = planMap(plans, d);
    const undecided = rs ? rs.reduce((n, r) => n + r.items.filter(it => !pm[planKey(it.menu, r.student.id)]).length, 0) : 0;
    return `<button data-date="${d}" class="${d === date ? 'on' : ''}"><small>${fmtDate(d)}</small>
      <b class="${rs && rs.length ? 'some' : 'zero'}">${rs ? rs.length + '명' : '–'}</b>
      <small>${!rs ? '식단 미등록' : undecided ? `미정 ${undecided}건` : rs.length ? '대체식 완료 ✓' : '주의 없음'}</small></button>`;
  }).join('');

  // 메뉴별로 해당 학생 묶기
  const byMenu = {};
  risks.forEach(r => r.items.forEach(it => {
    (byMenu[it.menu] = byMenu[it.menu] || []).push({ st: r.student, hits: it.hits });
  }));

  const cards = Object.entries(byMenu).map(([menu, list], mi) => {
    const hitsAll = [...new Set(list.flatMap(x => x.hits))].sort((a, b) => a - b);
    const cands = suggestSubs(menu, hitsAll).map(([name]) => {
      const unsafe = list.filter(x => subAllergens(name).some(a => x.st.allergens.includes(a)));
      return { name, unsafe };
    });
    const dl = `dl-${mi}`;
    return `<div class="menu-card">
      <h3>${esc(menu)} <span class="muted" style="font-weight:400;font-size:14px">· 주의 학생 ${list.length}명</span></h3>
      <div>${chips(hitsAll, hitsAll)}</div>
      <div class="muted" style="font-size:13px;margin-top:8px">추천 대체식 (누르면 안전한 학생 모두에게 적용)</div>
      <div class="cands">${cands.map(c => `<button class="cand ${c.unsafe.length ? 'partial' : 'safe'}" data-menu="${esc(menu)}" data-sub="${esc(c.name)}">
        ${esc(c.name)} <small>${c.unsafe.length ? `⚠ ${c.unsafe.map(x => esc(x.st.name)).join(', ')} 불가` : '✓ 모두 안전'}</small></button>`).join('')}</div>
      <datalist id="${dl}">${cands.map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
      ${list.map(({ st, hits }) => {
        const v = draft[planKey(menu, st.id)] || '';
        const clash = v ? subAllergens(v).filter(a => st.allergens.includes(a)) : [];
        return `<div class="pick">
          <div><b>${stuLabel(st)}</b>${sevBadges(st)}<br>${chips(st.allergens, hits)}</div>
          <div><input type="text" list="${dl}" placeholder="대체식 입력 또는 선택" value="${esc(v)}"
                 data-menu="${esc(menu)}" data-sid="${st.id}">
            ${clash.length ? `<div class="warnline">⚠ 이 대체식에 ${clash.map(a => ALLERGENS[a]).join(', ')}이(가) 들어 있을 수 있어요</div>` : ''}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  const qty = {};
  Object.entries(draft).forEach(([k, v]) => {
    const [menu, sid] = k.split('||');
    if (v && risks.some(r => r.student.id === sid && r.items.some(i => i.menu === menu))) qty[v] = (qty[v] || 0) + 1;
  });

  $('#admin-content').innerHTML = `
    <div class="card no-print"><div class="row">
      <label class="f" style="margin:0">날짜</label>
      <input type="date" id="plan-date" value="${date}" style="max-width:180px">
      <button class="btn" data-nav="-7">◀ 지난주</button><button class="btn" data-nav="7">다음주 ▶</button>
    </div></div>
    <div class="week">${weekHTML}</div>
    <h2 style="margin:0 0 10px">${fmtDate(date)} 위험 체크</h2>
    ${!meal ? `<div class="card">이 날짜의 식단이 없습니다. <button class="btn sm primary" onclick="state.sub='meal';state.mealDate='${date}';renderAdmin()">식단 입력하러 가기</button></div>`
      : !risks.length ? '<div class="card ok">등록된 학생 중 이 날 위험 메뉴가 있는 학생이 없습니다. 🙂</div>'
      : cards + `
      <div class="card"><h3>대체식 준비 수량</h3>${Object.keys(qty).length ? Object.entries(qty).map(([k, v]) =>
        `<span class="chip" style="font-size:15px">${esc(k)} <b>${v}</b></span>`).join(' ') : '<span class="muted">아직 정한 대체식이 없습니다.</span>'}
        <div class="row" style="margin-top:12px"><button class="btn primary" id="save-plan">저장하고 선생님들께 공유</button>
        <button class="btn" onclick="window.print()">인쇄</button></div>
        <p class="note">대체식 추천은 일반적인 식재료 기준입니다. 실제 사용하는 제품의 원재료 표시와 교차오염 가능성은 영양교사가 최종 확인해 주세요.</p>
      </div>`}`;

  const c = $('#admin-content');
  c.querySelectorAll('.week button').forEach(b => b.onclick = () => { state.planDate = b.dataset.date; renderPlan(); });
  c.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.planDate = addDays(state.planDate, +b.dataset.nav); renderPlan(); });
  $('#plan-date').onchange = e => { if (e.target.value) { state.planDate = e.target.value; renderPlan(); } };
  c.querySelectorAll('.cand').forEach(b => b.onclick = () => {
    const menu = b.dataset.menu, sub = b.dataset.sub;
    byMenu[menu].forEach(({ st }) => {
      if (!subAllergens(sub).some(a => st.allergens.includes(a))) draft[planKey(menu, st.id)] = sub;
    });
    renderPlan();
  });
  c.querySelectorAll('input[data-sid]').forEach(inp => inp.onchange = () => {
    draft[planKey(inp.dataset.menu, inp.dataset.sid)] = inp.value.trim();
    renderPlan();
  });
  const sb = $('#save-plan');
  if (sb) sb.onclick = () => {
    const list = [];
    risks.forEach(r => r.items.forEach(it => {
      const v = draft[planKey(it.menu, r.student.id)];
      if (v) list.push({ menu: it.menu, studentId: r.student.id, substitute: v });
    }));
    adminSave('savePlans', [date, list], '대체식이 저장되어 선생님 공유 화면에 반영되었습니다.');
  };
}

/* ---- 3-2. 식단 입력 ---- */
function parseMenuText(text) {
  return text.split(/\r?\n|<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).map(line => {
    line = line.replace(/^[*#\-•·\s]+/, '');
    // "메뉴(1.2.5)", "메뉴 1.2.5.", "메뉴1.2.5." 형태의 끝부분 번호만 알레르기 번호로 본다
    const m = line.match(/^(.*?)(\s*\(\s*|\s+)?((?:\d{1,2}\s*[.,]\s*)*\d{1,2})\s*\.?\s*\)?\s*$/);
    let name = line, nums = [];
    if (m && m[1].trim() && (m[2] || /[.,]/.test(m[3]))) {
      name = m[1].trim();
      nums = m[3].split(/[.,]/).map(Number).filter(n => n >= 1 && n <= 19);
    }
    let guessed = false;
    if (!nums.length) { nums = guessAllergens(name); guessed = nums.length > 0; }
    return { name, allergens: [...new Set(nums)].sort((a, b) => a - b), guessed };
  });
}
function renderMeal() {
  const date = state.mealDate;
  const saved = state.admin.meals.find(m => m.date === date);
  if (state.mealDraftDate !== date || !state.mealDraft) {
    state.mealDraft = saved ? saved.menus.map(m => ({ ...m, guessed: false })) : [];
    state.mealDraftDate = date;
  }
  const rows = state.mealDraft;
  const studs = approved();
  $('#admin-content').innerHTML = `
    <div class="card">
      <h2>식단 입력</h2>
      <p class="sub">NEIS 식단표를 복사해 붙여넣으면 메뉴 옆 알레르기 번호를 자동으로 읽습니다. 번호가 없는 메뉴는 이름으로 추정하니 꼭 확인하세요.</p>
      <div class="row"><label class="f" style="margin:0">날짜</label>
        <input type="date" id="meal-date" value="${date}" style="max-width:180px">
        <button class="btn" data-nav="-1">◀ 전날</button><button class="btn" data-nav="1">다음날 ▶</button>
        ${saved ? '<span class="ok">저장된 식단 있음</span>' : '<span class="muted">저장된 식단 없음</span>'}</div>
      <label class="f">식단 붙여넣기 (한 줄에 메뉴 하나)</label>
      <textarea id="meal-text" placeholder="예)\n현미밥\n쇠고기미역국(5.6.16)\n돈육떡갈비 1.2.5.6.10.13.\n계란말이\n우유"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="parse-replace">분석해서 아래 표 바꾸기</button>
        <button class="btn" id="parse-add">분석해서 아래 표에 추가</button>
      </div>
    </div>
    <div class="card">
      <h3>${fmtDate(date)} 메뉴</h3>
      ${rows.length ? `<table><thead><tr><th style="width:34%">메뉴</th><th style="width:22%">알레르기 번호</th><th>식품</th><th>주의 학생</th><th></th></tr></thead><tbody>
      ${rows.map((r, i) => {
        const who = studs.filter(s => r.allergens.some(a => s.allergens.includes(a)));
        return `<tr>
        <td><input type="text" data-i="${i}" data-k="name" value="${esc(r.name)}"></td>
        <td><input type="text" data-i="${i}" data-k="allergens" value="${r.allergens.join('.')}" placeholder="예) 1.2.6"></td>
        <td>${r.guessed ? '<span class="chip guess">추정·확인 필요</span><br>' : ''}${chips(r.allergens)}</td>
        <td>${who.length ? `<span class="bad">${who.length}명</span><br><span class="muted" style="font-size:13px">${who.map(s => esc(s.name)).join(', ')}</span>` : '<span class="muted">-</span>'}</td>
        <td><button class="btn sm danger" data-del="${i}">삭제</button></td></tr>`;
      }).join('')}</tbody></table>` : '<p class="muted">아직 메뉴가 없습니다. 위에 붙여넣거나 한 줄씩 추가하세요.</p>'}
      <div class="row" style="margin-top:10px">
        <button class="btn" id="add-row">+ 메뉴 한 줄 추가</button>
        <button class="btn primary" id="save-meal">식단 저장</button>
        ${saved ? '<button class="btn danger" id="del-meal">이 날 식단 삭제</button>' : ''}
      </div>
    </div>`;

  const c = $('#admin-content');
  $('#meal-date').onchange = e => { if (e.target.value) { state.mealDate = e.target.value; renderMeal(); } };
  c.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.mealDate = addDays(state.mealDate, +b.dataset.nav); renderMeal(); });
  const parse = replace => {
    const parsed = parseMenuText($('#meal-text').value);
    if (!parsed.length) return alert('붙여넣은 메뉴가 없습니다.');
    state.mealDraft = replace ? parsed : rows.concat(parsed);
    renderMeal();
  };
  $('#parse-replace').onclick = () => parse(true);
  $('#parse-add').onclick = () => parse(false);
  $('#add-row').onclick = () => { rows.push({ name: '', allergens: [], guessed: false }); renderMeal(); };
  c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); renderMeal(); });
  c.querySelectorAll('input[data-k]').forEach(inp => inp.onchange = () => {
    const r = rows[+inp.dataset.i];
    if (inp.dataset.k === 'name') r.name = inp.value.trim();
    else {
      r.allergens = [...new Set(inp.value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 19))].sort((a, b) => a - b);
      r.guessed = false;
    }
    renderMeal();
  });
  $('#save-meal').onclick = () => {
    const g = rows.filter(r => r.guessed).length;
    if (g && !confirm(`이름으로 추정한 메뉴가 ${g}개 있습니다. 알레르기 번호를 확인하셨나요?`)) return;
    adminSave('saveMeal', [date, rows.map(r => ({ name: r.name, allergens: r.allergens }))],
      '식단이 저장되었습니다. 위험 체크가 자동으로 다시 계산됩니다.');
  };
  const dm = $('#del-meal');
  if (dm) dm.onclick = () => confirm('이 날 식단을 삭제할까요?') && adminSave('saveMeal', [date, []], '삭제되었습니다.');
}

/* ---- 3-3. 학생 명단 ---- */
function renderStudents() {
  const all = state.admin.students.slice().sort(byClass);
  const pend = all.filter(s => s.status === 'pending');
  const ok = all.filter(s => s.status === 'approved');
  const rej = all.filter(s => s.status === 'rejected');
  const row = (s, actions) => `<tr>
    <td>${s.grade}-${s.classNo}</td><td>${s.number}</td><td><b>${esc(s.name)}</b>${sevBadges(s)}</td>
    <td>${chips(s.allergens)}${s.memo ? `<div class="muted" style="font-size:13px">📝 ${esc(s.memo)}</div>` : ''}</td>
    <td style="font-size:13px">${esc(s.guardian)}<br>${esc(s.contact)}</td>
    <td style="white-space:nowrap">${actions}</td></tr>`;
  const head = '<thead><tr><th>반</th><th>번호</th><th>이름</th><th>알레르기</th><th>보호자</th><th></th></tr></thead>';
  $('#admin-content').innerHTML = `
    ${pend.length ? `<div class="card" style="border-color:var(--warn)"><h3>승인 대기 ${pend.length}명</h3>
      <p class="sub">보호자가 제출한 정보입니다. 확인 후 승인하면 위험 체크에 반영됩니다. 같은 학생이 이미 있으면 기존 정보를 삭제하거나 수정하세요.</p>
      <div style="overflow-x:auto"><table>${head}<tbody>${pend.map(s => row(s,
        `<button class="btn sm primary" data-act="approve" data-id="${s.id}">승인</button>
         <button class="btn sm" data-act="edit" data-id="${s.id}">수정</button>
         <button class="btn sm danger" data-act="reject" data-id="${s.id}">반려</button>`)).join('')}</tbody></table></div></div>` : ''}
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3 style="margin:0">관리 중인 학생 ${ok.length}명</h3>
        <button class="btn primary" data-act="new">+ 학생 직접 추가</button></div>
      <div style="overflow-x:auto"><table>${head}<tbody>${ok.map(s => row(s,
        `<button class="btn sm" data-act="edit" data-id="${s.id}">수정</button>
         <button class="btn sm danger" data-act="delete" data-id="${s.id}">삭제</button>`)).join('') ||
        '<tr><td colspan="6" class="muted">아직 승인된 학생이 없습니다.</td></tr>'}</tbody></table></div>
    </div>
    ${rej.length ? `<div class="card"><h3 class="muted">반려 ${rej.length}명</h3><div style="overflow-x:auto"><table>${head}<tbody>${rej.map(s => row(s,
        `<button class="btn sm" data-act="approve" data-id="${s.id}">승인</button>
         <button class="btn sm danger" data-act="delete" data-id="${s.id}">삭제</button>`)).join('')}</tbody></table></div></div>` : ''}
    <p class="note">새 학년이 시작되면 진급한 학생의 학년·반을 수정하거나, 보호자에게 등록 화면 링크를 다시 안내해 주세요.</p>`;

  $('#admin-content').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, act = b.dataset.act;
    const s = all.find(x => x.id === id);
    if (act === 'approve') adminSave('setStudentStatus', [id, 'approved'], `${s.name} 학생을 승인했습니다.`, true);
    if (act === 'reject') confirm(`${s.name} 학생 등록을 반려할까요?`) && adminSave('setStudentStatus', [id, 'rejected'], '반려했습니다.', true);
    if (act === 'delete') confirm(`${s.name} 학생 정보를 삭제할까요? 대체식 기록도 함께 지워집니다.`) && adminSave('deleteStudent', [id], '삭제했습니다.', true);
    if (act === 'edit' || act === 'new') editStudent(s);
  });
}
function editStudent(s) {
  const modal = $('#modal');
  modal.innerHTML = `<div class="card"><h2>${s ? '학생 정보 수정' : '학생 직접 추가'}</h2>
    <form>${studentFormHTML(s || {})}
      <div class="row" style="margin-top:14px"><button class="btn primary">저장${s && s.status === 'pending' ? ' 후 승인' : ''}</button>
      <button class="btn" type="button" id="close-modal">닫기</button></div><div class="msgbox"></div></form></div>`;
  modal.classList.remove('hidden');
  $('#close-modal').onclick = () => modal.classList.add('hidden');
  modal.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const data = readStudentForm(e.target);
    try {
      validateStudent(data);
      if (s) data.id = s.id;
      await call('saveStudent', state.adminPin, data);
      if (s && s.status === 'pending') await call('setStudentStatus', state.adminPin, s.id, 'approved');
      modal.classList.add('hidden');
      await adminSave('login', [], '저장했습니다.', true);
    } catch (err) { e.target.querySelector('.msgbox').innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
  };
}
