<script>
/* =========================================================
   기본 데이터: 알레르기 유발식품 19종(학교급식 식단표 표시 번호)
   ========================================================= */
const ALLERGENS = {
  1: '난류(달걀)', 2: '우유', 3: '메밀', 4: '땅콩', 5: '대두', 6: '밀', 7: '고등어', 8: '게', 9: '새우',
  10: '돼지고기', 11: '복숭아', 12: '토마토', 13: '아황산류', 14: '호두', 15: '닭고기', 16: '쇠고기',
  17: '오징어', 18: '조개류', 19: '잣'
};
const SEVERITY = { mild: '가벼움', caution: '주의', severe: '심각' };

/* =========================================================
   공통 도구
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const DOW = '일월화수목금토';
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})`; };
function weekDates(s) {
  const d = parseYmd(s);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return [0, 1, 2, 3, 4].map(i => { const x = new Date(d); x.setDate(d.getDate() + i); return ymd(x); });
}
function schoolDay(d = new Date()) {
  const s = ymd(d), w = d.getDay();
  return w === 6 ? addDays(s, 2) : w === 0 ? addDays(s, 1) : s;
}
const chips = (nums, hits = []) => nums.map(n =>
  `<span class="chip ${hits.includes(n) ? 'hit' : ''}">${n}. ${esc(ALLERGENS[n])}</span>`).join('');
const stuLabel = s => `${s.grade}-${s.classNo} ${s.number}번 ${esc(s.name)}`;
const byClass = (a, b) => a.grade - b.grade || a.classNo - b.classNo || a.number - b.number;
function sevBadges(s) {
  return `<span class="badge b-${s.severity}">${SEVERITY[s.severity] || ''}</span>` +
         (s.epipen ? '<span class="badge b-epi">에피펜</span>' : '');
}

/** 학생 × 식단 대조: 위험 메뉴가 있는 학생만 돌려준다. */
function risksFor(students, meal) {
  if (!meal) return [];
  return students.map(st => ({
    student: st,
    items: meal.menus.map(m => ({ menu: m.name, hits: m.allergens.filter(a => st.allergens.includes(a)) }))
                     .filter(x => x.hits.length),
  })).filter(r => r.items.length).sort((a, b) => byClass(a.student, b.student));
}
/** date 이후 가장 가까운 식단 날짜 (없으면 가장 최근 날짜) */
function nearestMealDate(dates, date) {
  const ds = dates.slice().sort();
  return ds.find(d => d >= date) || ds[ds.length - 1] || null;
}
const planKey = (menu, sid) => menu + '||' + sid;
function planMap(plans, date) {
  const m = {};
  plans.filter(p => p.date === date).forEach(p => { m[planKey(p.menu, p.studentId)] = p.substitute; });
  return m;
}

/* =========================================================
   서버 연결: Apps Script 안이면 google.script.run, 아니면 데모 서버
   ========================================================= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn, ...args) {
  if (IS_GAS) {
    return new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e.message || e)))[fn](...args));
  }
  if (typeof Demo === 'undefined') return Promise.reject(new Error('Apps Script 웹앱 주소로 열어 주세요.'));
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e); } }, 120));
}

function validateStudent(s) {
  if (!(s.grade >= 1 && s.grade <= 6)) throw new Error('학년을 확인해 주세요.');
  if (!(s.classNo >= 1 && s.classNo <= 30)) throw new Error('반을 확인해 주세요.');
  if (!(s.number >= 1 && s.number <= 60)) throw new Error('번호를 확인해 주세요.');
  if (!String(s.name || '').trim()) throw new Error('학생 이름을 입력해 주세요.');
  if (!s.allergens || !s.allergens.length) throw new Error('알레르기 종류를 한 가지 이상 선택해 주세요.');
}

/* =========================================================
   상태와 화면 전환
   ========================================================= */
const state = {
  tab: 'register', sub: 'plan',
  staffPin: store.get('staffPin'), adminPin: store.get('adminPin'),
  staff: null, staffWeek: null, staffDate: schoolDay(), filter: '',
  admin: null, planDate: schoolDay(), mealDate: schoolDay(),
  draft: null, draftDate: null, mealDraft: null, mealDraftDate: null,
  pdfImport: null, pdfAttach: true,
};

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('button[data-tab]');
  if (t) { state.tab = t.dataset.tab; route(); }
});
document.getElementById('admin-tabs').addEventListener('click', e => {
  const t = e.target.closest('button[data-sub]');
  if (t) { state.sub = t.dataset.sub; runIf('renderAdmin', '#admin-content'); }
});

/** 아직 만들지 않은 파일의 함수면 안내 문구를 보여 준다 (단계별로 만들 때 화면이 깨지지 않게). */
function runIf(name, el, ...args) {
  if (typeof window[name] === 'function') return window[name](...args);
  const box = $(el);
  box.classList.remove('hidden');
  box.innerHTML = '<div class="card muted">아직 만들지 않은 화면입니다. 다음 단계에서 만들어요.</div>';
}

function route() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  ['register', 'staff', 'admin'].forEach(t => $('#view-' + t).classList.toggle('hidden', t !== state.tab));
  if (state.tab === 'register') runIf('renderRegister', '#reg-form');
  if (state.tab === 'staff') runIf('openStaff', '#staff-body');
  if (state.tab === 'admin') runIf('openAdmin', '#admin-login');
}

function loginBox(el, title, desc, onPin) {
  el.innerHTML = `<h2>${title}</h2><p class="sub">${desc}</p>
    <form class="row"><input type="password" inputmode="numeric" class="grow" placeholder="PIN 입력" autocomplete="off">
    <button class="btn primary">들어가기</button></form><div class="msgbox"></div>`;
  el.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const pin = el.querySelector('input').value.trim();
    try { await onPin(pin, await call('login', pin)); }
    catch (err) { el.querySelector('.msgbox').innerHTML = `<div class="msg bad">${esc(err.message)}</div>`; }
  };
  el.querySelector('input').focus();
}

function toast(text) {
  const t = document.createElement('div');
  t.className = 'msg ok'; t.textContent = text;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.15)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
</script>
